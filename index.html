<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.1/js/all.min.js"></script>
    <title>Savings Widget</title>

<style>
    body {
        background-color: transparent;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .box {
        background: linear-gradient(135deg, #36251E 0%, #1E130E 100%);
        width: 100%;
        max-width: 340px; /* Rectangular width */
        padding: 22px 28px;
        border-radius: 14px;
        text-align: center;
        color: #F7F4EF;
        font-family: "Comic Sans MS", "Comic Sans", cursive; /* Comic Sans font */
        box-sizing: border-box;
        box-shadow: 0 10px 25px rgba(30, 19, 14, 0.25);
        border: 1px solid #4D372E;
    }
    .header {
        font-size: 32px;
        font-weight: bold;
        color: #E5B299; /* Warm bronze-gold contrast */
        margin-bottom: 8px;
    }
    .header i {
        font-size: 26px;
        margin-right: 10px;
        color: #E5B299;
    }
    .desc {
        font-size: 14px;
        line-height: 1.4;
        color: #D2C5BC; /* Soft cream brown text */
    }
</style>

</head>
<body>
    <div class="box">
        <div class="header">
            <i class="fas fa-vault"></i>20%
        </div>
        <div class="desc">of income directed straight to your savings goal.</div>
    </div>
</body>
</html>
