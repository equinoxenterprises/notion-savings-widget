<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.1/js/all.min.js"></script>
    <title>Savings Widget</title>

<style>
    body {
        background-color: transparent;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .box {
        background: linear-gradient(135deg, #36251E 0%, #1E130E 100%);
        width: 100%;
        max-width: 340px;
        padding: 24px 28px;
        border-radius: 14px;
        text-align: center;
        color: #F7F4EF;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        box-sizing: border-box;
        box-shadow: 0 10px 25px rgba(30, 19, 14, 0.25);
        border: 1px solid #4D372E;
    }
    .icon-container {
        font-size: 26px;
        color: #E5B299;
        margin-bottom: 8px;
    }
    .header {
        font-size: 34px;
        font-weight: bold;
        color: #E5B299;
        margin-bottom: 10px;
    }
    .desc {
        font-size: 13px;
        line-height: 1.5;
        color: #D2C5BC;
    }
</style>

</head>
<body>
    <div class="box">
        <div class="icon-container">
            <i class="fas fa-vault"></i>
        </div>
        <div class="header">20%</div>
        <div class="desc">Financial Freedom Check: Have you locked away your 20% savings today?</div>
    </div>
</body>
</html>
