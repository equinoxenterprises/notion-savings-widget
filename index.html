<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.1/js/all.min.js"></script>
    <title>Savings Goal Box</title>

<style>
    body {
        background-color: transparent;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .box {
        background-color: #2c221e; /* Deep espresso brown (rich brand base) */
        width: 100%;
        max-width: 220px;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        color: #f5f2eb; /* Soft cream text for high readability */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        box-sizing: border-box;
        box-shadow: 0 4px 12px rgba(44, 34, 30, 0.15);
        border: 1px solid #3d302a;
        transition: transform 0.2s ease;
    }
    .box:hover {
        transform: translateY(-2px);
    }
    .header {
        font-size: 32px;
        font-weight: 700;
        color: #d4a373; /* Warm aesthetic bronze/gold contrast color */
        margin-bottom: 8px;
    }
    .desc {
        font-size: 13px;
        line-height: 1.4;
        color: #d8d0c5;
    }
</style>

</head>
<body>
    <div class="box">
        <div class="header">
            <i class="fas fa-piggy-bank"></i><br>
            20%
        </div>
        <div class="desc">of income directed straight to your savings goal.</div>
    </div>
</body>
</html>
